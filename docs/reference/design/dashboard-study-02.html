/* Review pass: workspace, compact controls, and accessible inspection. */
body{height:100dvh;min-height:100dvh;overflow:auto}
.study,header,footer{flex-shrink:0}

.toolbar{position:sticky;top:-1px;z-index:2;background:var(--bg);padding-top:3px}

.card-bottom{padding:4px 12px;min-height:54px;gap:8px;flex-wrap:wrap}

const art=p=>`<img src="${artwork[p.art]}" alt="" decoding="async">`;
const swatches=()=>'<span class="swatches"><i class="swatch" style="--color:#a3e4bb"></i><i class="swatch" style="--color:#e99564"></i><i class="swatch" style="--color:#d5d0b2"></i><i class="swatch" style="--color:#8c96a2"></i></span>';
function render(){
 const query=$('#search').value.trim().toLowerCase();
 const matches=all().filter(p=>(p.name+' '+p.model).toLowerCase().includes(query));
 $('.filters').innerHTML=Object.entries(predicates).map(([label,test])=>`<button aria-pressed="${label===filter}" data-filter="${label}">${label}<span class="count">${matches.filter(test).length}</span></button>`).join('');
 $('#mobile-filter').innerHTML=Object.entries(predicates).map(([label,test])=>`<option value="${label}" ${label===filter?'selected':''}>${label} (${matches.filter(test).length})</option>`).join('');
 const list=matches.filter(predicates[filter]).sort((a,b)=>{const rank=p=>p.state==='Offline'?2:p.state==='Idle'?1:0;return rank(a)-rank(b)||a[$('#sort').value].localeCompare(b[$('#sort').value]);});
 $('#search-status').textContent=`${list.length} matching ${list.length===1?'printer':'printers'} in ${filter.toLowerCase()}.`;
 $('#printers').innerHTML=list.length?list.map(p=>`<article class="printer ${p.state.toLowerCase()}"><div class="card-head"><div class="art">${art(p)}</div><div class="card-identity"><h2><button class="card-name" data-open="${p.id}">${p.name}</button></h2><p class="model">${p.model}</p><span class="state ${p.state.toLowerCase()}">${p.state}</span></div></div>${p.state==='Offline'?'':p.state==='Idle'?`<div class="job idle-job"><h3>No active print</h3></div>`:`<div class="job"><p class="eyebrow">CURRENT PRINT</p><h3>${p.job}</h3></div><div class="progress"><div class="progress-line"><span>Reported progress</span><strong>${p.progress}%</strong></div><div class="track"><div class="fill" style="width:${p.progress}%"></div></div></div><div class="timing"><div><span class="label">Remaining</span><span class="value">${p.left}</span></div><div><span class="label">${p.state==='Paused'?'Finish estimate':'Est. finish'}</span><span class="value">${p.finish}</span></div></div>`}${p.state==='Offline'?'':`<div class="temperatures"><div class="temperature"><span class="label">Nozzle</span><span class="value">${p.nozzle}<small> / ${p.target}°C</small></span></div><div class="temperature"><span class="label">Bed</span><span class="value">${p.bed}<small> / ${p.state==='Idle'?'0':p.bed}°C</small></span></div></div><div class="material"><span class="material-name">${swatches()}${p.material}</span><span class="fresh">Fresh</span></div>`}<div class="card-bottom">${p.notice?`<button class="attention-link" data-open="${p.id}" data-notices="true" aria-label="View notices: ${p.name}">! 1 needs attention</button>`:`<span>${p.state==='Offline'?'Readings unavailable':'No active notices'}</span>`}<button data-open="${p.id}" aria-label="Details: ${p.name}">Details ↗</button></div></article>`).join(''):`<div class="empty"><h3>No matching printers</h3><p>${query?`No ${filter==='All printers'?'printers':'printers in '+escape(filter.toLowerCase())} match “${escape($('#search').value.trim())}”.`:`No printers are in ${escape(filter.toLowerCase())}.`}</p><div class="empty-actions">${query?'<button data-recovery="search">Clear search</button>':''}${filter!=='All printers'?'<button data-recovery="filter">Show all statuses</button>':''}</div></div>`;
}
function content(){
 const p=selected;let html='';
 if(tab==='overview')html=p.state==='Offline'?'<p>Printer reported offline. Job, temperature, and filament readings are unavailable.</p>':`${p.state==='Idle'?'<div class="detail-job"><div><p class="eyebrow">REPORTED IDLE</p><h3>No active print</h3><p class="detail-muted">Reported idle does not establish physical readiness.</p></div>'+art(p)+'</div>':`<div class="detail-job"><div><span class="state ${p.state.toLowerCase()}">${p.state}</span><h3>${p.job}</h3><div class="detail-progress">${p.progress}%</div><div class="track"><div class="fill" style="width:${p.progress}%;${p.state==='Paused'?'background:var(--warn)':''}"></div></div></div>${art(p)}</div><div class="detail-grid"><div><span class="label">Reported remaining</span><span class="value">${p.left}</span></div><div><span class="label">Estimated finish</span><span class="value">${p.finish}</span></div><div><span class="label">Stage</span><span class="value">${p.stage}</span></div><div><span class="label">Layer</span><span class="value">${p.layer}</span></div></div>`}<section class="detail-section"><h3>Temperatures</h3><div class="temp-grid"><div class="temp-tile"><span class="label">Nozzle</span><span>${p.nozzle} / ${p.target}°C</span></div><div class="temp-tile"><span class="label">Bed</span><span>${p.bed} / ${p.state==='Idle'?'0':p.bed}°C</span></div><div class="temp-tile"><span class="label">Chamber</span><span>${p.chamber?p.chamber+'°C':'Unknown'}</span></div></div></section>${p.notice?'<div class="notice"><h3>Print paused · attention needed</h3><p class="detail-muted">See the reported condition and next step.</p><button class="inline-action" data-switch-tab="notices">View notices</button></div><br>':''}<details><summary>Reading details</summary><p>Model: ${p.model}<br>Telemetry: Fresh · reported 10:42:06 AM<br>Remaining estimate observed: 10:42:06 AM<br>Snapshot: 10:42:08 AM · local time<br>Synthetic fixture · no live printer connection</p></details>`;
 if(tab==='filament')html=p.state==='Offline'?'<p>Filament readings are unavailable while this printer is offline.</p>':`<p class="eyebrow">${p.model==='A1 Mini'?'AMS LITE':'AMS 1'}</p><h3>Filament inventory</h3><div class="rack">${['#a3e4bb','#e99564','#d5d0b2','#8c96a2'].map((c,i)=>`<div class="spool"><i style="--color:${c}"></i><span>Slot ${i+1}</span><span>${p.material.split(' ')[0]}</span><span>${[68,8,42,91][i]}%</span></div>`).join('')}</div><p class="detail-muted">Remaining quantities are reported estimates.</p><div class="detail-section" style="margin-top:22px"><span class="label">Reported drying</span><p>${p.model==='A1 Mini'?'Not supported by this unit':'Not drying'}</p></div>`;
 if(tab==='notices')html=p.notice?'<div class="notice"><p class="eyebrow">REPORTED CONDITION / UNREVIEWED</p><h3>Print paused · filament needs attention</h3><p>The printer reports a filament runout. Check the indicated spool and filament path at the printer before resuming through Bambu’s controls.</p><p class="meta">First observed 10:40:12 AM · local time</p><p class="local-note">Reviewing or hiding a notice is a local decision. It does not clear the fault or resume the print.</p></div>':'<p>No active notices reported.</p>';
 $('#detail-panel').innerHTML=html;$('#detail-panel').setAttribute('aria-labelledby','tab-'+tab);
 $$('[role=tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.tabIndex=b.dataset.tab===tab?0:-1;});
}
function openPrinter(id,notices,source){selected=all().find(p=>p.id===id);opener=source;tab=notices?'notices':'overview';$('#dialog-title').textContent=selected.name;$('#dialog-model').textContent=selected.model;$('#notice-count').textContent=selected.notice?'1':'';content();$('#inspector').showModal();$('#inspector .close').focus();}
$('#printers').addEventListener('click',e=>{
 const recovery=e.target.closest('[data-recovery]');
 if(recovery){if(recovery.dataset.recovery==='search'){$('#search').value='';render();$('#search').focus();}else{filter='All printers';render();if(getComputedStyle($('.mobile-filter')).display!=='none')$('#mobile-filter').focus();else $('[data-filter="All printers"]').focus();}return;}
 const b=e.target.closest('[data-open]');if(b)openPrinter(b.dataset.open,b.dataset.notices,b);
});
$('#detail-panel').addEventListener('click',e=>{const b=e.target.closest('[data-switch-tab]');if(b){tab=b.dataset.switchTab;content();$('[data-tab="'+tab+'"]').focus();}});
$('#mobile-filter').addEventListener('change',e=>{filter=e.target.value;render();});
$('.filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;render();$$('[data-filter]').find(b=>b.dataset.filter===filter).focus();});
$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);
$('#scenario').onclick=()=>{withOffline=!withOffline;$('#scenario').textContent=withOffline?'Hide offline example':'Show offline example';render();};
$$('[role=tab]').forEach(b=>{b.onclick=()=>{tab=b.dataset.tab;content();};b.onkeydown=e=>{const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();const tabs=$$('[role=tab]');const idx=tabs.indexOf(b);const next=e.key==='Home'?0:e.key==='End'?2:(idx+(e.key==='ArrowRight'?1:2))%3;tab=tabs[next].dataset.tab;content();tabs[next].focus();};});
$$('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('#inspector').addEventListener('close',()=>{if(opener?.isConnected)opener.focus();});
function info(title,body){$('#info-title').textContent=title;$('#info .info-body').innerHTML=body;$('#info').showModal();}
$('#help').onclick=()=>info('About this design study','<p>A standalone layout concept using synthetic printer data and the SVG printer illustrations from bambustand-ios.</p><p>Try the filters, search, sort, printer inspection, and Overview / Filament / Notices tabs. The control above the app adds an offline example.</p><p>Counts can overlap: a paused printer can need attention. Idle means reported idle; it does not establish physical readiness. No printer controls or notice mutations are connected.</p>');
$('#settings').onclick=()=>info('Settings','<p>This study focuses on the farm overview and printer inspection. Appearance and notification settings remain in the existing application.</p><p>No preferences are saved by this mockup.</p>');
render();

</script>
</body></html>
